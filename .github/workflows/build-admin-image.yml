name: Build MRICS Plane admin image

on:
  push:
    branches:
      - mrics/dev
    paths:
      - apps/admin/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - catalog.json
      - .github/workflows/build-admin-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-admin:
    name: Build admin (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/mrics-technologies/mrics-plane-admin"
          short_sha="${GITHUB_SHA::7}"
          tags="$image:dev-${{ matrix.arch }}-latest"
          tags+=$'\n'"$image:dev-${{ matrix.arch }}-$short_sha"
          tags+=$'\n'"$image:dev-${{ matrix.arch }}-$GITHUB_SHA"

          # Compatibility tags: keep existing ARM dev deployments working while
          # adding explicit architecture tags for x86_64/amd64 deployments.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            tags+=$'\n'"$image:dev-latest"
            tags+=$'\n'"$image:dev-$short_sha"
          fi

          {
            echo 'tags<<EOF'
            printf '%s\n' "$tags"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push admin (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile.admin
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
          cache-from: type=gha,scope=admin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=admin-${{ matrix.arch }}
          provenance: false
