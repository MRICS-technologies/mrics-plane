name: Test automatic state duration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/time-tracking-spike
      - mrics/dev
      - preview
      - "sync/**"
      - "release/**"
    paths:
      - apps/api/plane/db/models/time_tracking.py
      - apps/api/plane/db/management/commands/fix_auto_state_worklog_owners.py
      - apps/api/plane/api/views/time_tracking.py
      - apps/api/plane/app/urls/issue.py
      - apps/api/plane/tests/unit/models/test_time_tracking_auto_state.py
      - apps/api/plane/tests/contract/api/test_time_tracking_auto_state.py
      - apps/api/plane/tests/contract/api/test_contributor_analytics.py
      - apps/api/plane/app/views/analytic/project_analytics.py
      - apps/api/plane/app/urls/analytic.py
      - apps/api/plane/api/serializers/time_tracking.py
      - apps/api/plane/api/urls/time_tracking.py
      - apps/api/plane/api/views/issue.py
      - apps/api/plane/app/views/issue/base.py
      - apps/api/plane/bgtasks/issue_automation_task.py
      - apps/api/plane/db/migrations/0122_time_tracking.py
      - apps/api/plane/db/migrations/0123_workitemworklog_auto_state_source.py
      - apps/api/pyproject.toml
      - apps/api/uv.lock
      - .github/workflows/test-auto-state-duration.yml
  pull_request:
    branches:
      - mrics/dev
    paths:
      - apps/api/plane/db/models/time_tracking.py
      - apps/api/plane/db/management/commands/fix_auto_state_worklog_owners.py
      - apps/api/plane/api/views/time_tracking.py
      - apps/api/plane/app/urls/issue.py
      - apps/api/plane/tests/unit/models/test_time_tracking_auto_state.py
      - apps/api/plane/tests/contract/api/test_time_tracking_auto_state.py
      - apps/api/plane/tests/contract/api/test_contributor_analytics.py
      - apps/api/plane/app/views/analytic/project_analytics.py
      - apps/api/plane/app/urls/analytic.py
      - apps/api/plane/api/serializers/time_tracking.py
      - apps/api/plane/api/urls/time_tracking.py
      - apps/api/plane/api/views/issue.py
      - apps/api/plane/app/views/issue/base.py
      - apps/api/plane/bgtasks/issue_automation_task.py
      - apps/api/plane/db/migrations/0122_time_tracking.py
      - apps/api/plane/db/migrations/0123_workitemworklog_auto_state_source.py
      - apps/api/pyproject.toml
      - apps/api/uv.lock
      - .github/workflows/test-auto-state-duration.yml

permissions:
  contents: read

jobs:
  test-auto-state-duration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plane -d plane_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/plane_test
      DJANGO_SETTINGS_MODULE: plane.settings.test
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-auto-state-duration-test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv version comes from [tool.uv] required-version.
          version-file: "apps/api/pyproject.toml"
          # Same patch release as the production image (python:3.12.12-alpine).
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      # Default groups (dev + test) bring pytest and the psycopg binary wheel.
      - name: Install API and test dependencies
        working-directory: apps/api
        run: uv sync --locked

      - name: Run automatic state-duration regression tests
        working-directory: apps/api
        run: >-
          uv run --no-sync pytest
          plane/tests/unit/models/test_time_tracking_auto_state.py
          plane/tests/contract/api/test_time_tracking_auto_state.py
          plane/tests/contract/api/test_contributor_analytics.py
          -q
