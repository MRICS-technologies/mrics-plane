name: Build MRICS Plane frontend image

on:
  push:
    branches:
      - mrics/dev
    paths:
      - apps/web/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - catalog.json
      - .github/workflows/build-frontend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    # Native ARM runner avoids slow/stuck QEMU arm64 Docker builds for the dev Coolify server.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mrics-technologies/mrics-plane-frontend
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.web
          # Dev Coolify server pulls the ARM64 image; single-platform build avoids long/stuck multi-arch exports.
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
