name: Deploy MRICS Plane to Coolify

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      target:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

concurrency:
  group: plane-coolify-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: mrics-technologies
  # CoolifyVBSManagement Hub (coolify.mrics.art) since 2026-10-07; same host 16.16.240.94.
  PLANE_SERVER_UUID: ytofgz18fk0rzcreebfzu8aw
  PLANE_SERVER_IP: 16.16.240.94
  PLANE_PRODUCTION_SERVICE_UUID: 2yztifszbnrzrkorwciqp63m
  # MRICS internal Plane (plane.mrics.art), same server, created 2026-11-14 (t_496cf747).
  PLANE_MRICS_SERVICE_UUID: lo01cadmgzdrahu71kfhoq34
  PLANE_STAGING_SERVICE_UUID: 6sghhofxq40eiicqezzznkte
  # Upstream images the fork does not build. Keep on the same Plane release as the merged upstream
  # tag (v1.5.0: live calls the API's new pages/<id>/live-access/ check). Tag + index digest
  # (amd64 + arm64), verified on Docker Hub 2026-11-23.
  PLANE_LIVE_IMAGE: makeplane/plane-live:v1.5.0@sha256:f285e6979ed213b39207fcdf62abee9b5bde5dcc3731b4346d71e3a4f595810f
  PLANE_SPACE_IMAGE: makeplane/plane-space:v1.5.0@sha256:e7fd925a61796c4e37c2c42b39bf0c660dd0d4ca220705df70bee9f5e28e9273
  # MinIO deleted minio/minio + minio/mc from Docker Hub (2026-09-11); quay.io/minio needs auth.
  # This is the exact build all three stacks run (RELEASE.2025-09-07T16-13-09Z, amd64; identical
  # rootfs to the cached minio/minio:latest), mirrored to our GHCR. It ships mc, so it also runs
  # plane-minio-setup. Pushed + pull-checked on 16.16.240.94 on 2026-11-23.
  PLANE_MINIO_IMAGE: ghcr.io/mrics-technologies/minio:RELEASE.2025-09-07T16-13-09Z@sha256:0812f09f2a024d2e06192c911f280356c8ed9c37d8d3a9cd4c76420a75ef6862
  # Traefik is the only proxy in front of plane-api (DNS is not Cloudflare-proxied). Use 2 behind a CDN.
  PLANE_NUM_PROXIES: "1"

jobs:
  plan:
    name: Resolve deployment target
    if: github.event_name != 'push' || github.event.created != true
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.plan.outputs.target }}
      channel: ${{ steps.plan.outputs.channel }}
      instances: ${{ steps.plan.outputs.instances }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          target="${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref_name }}"
          case "$target" in
            staging)
              instances='[{"name":"staging","service_uuid":"'"$PLANE_STAGING_SERVICE_UUID"'","public_host":"stage.plane.mrics.art"}]'
              ;;
            production)
              # One release updates both production instances with the same image digests.
              # Scalezy first; max-parallel 1 + fail-fast leaves MRICS untouched if Scalezy fails.
              instances='[{"name":"scalezy","service_uuid":"'"$PLANE_PRODUCTION_SERVICE_UUID"'","public_host":"plane.scalezy.com"},{"name":"mrics","service_uuid":"'"$PLANE_MRICS_SERVICE_UUID"'","public_host":"plane.mrics.art"}]'
              ;;
            *)
              echo "Unsupported branch/target: $target" >&2
              exit 1
              ;;
          esac
          short_sha="${GITHUB_SHA::7}"
          {
            echo "target=$target"
            echo "channel=$target"
            echo "instances=$instances"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend image
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      image: ghcr.io/mrics-technologies/mrics-plane-backend@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mrics-technologies/mrics-plane-backend:${{ needs.plan.outputs.channel }}
            ghcr.io/mrics-technologies/mrics-plane-backend:${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend-${{ needs.plan.outputs.channel }}
          cache-to: type=gha,mode=max,scope=backend-${{ needs.plan.outputs.channel }}
          provenance: false

  build-web-admin:
    name: Build ${{ matrix.component }} image (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            dockerfile: apps/web/Dockerfile.web
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - component: frontend
            dockerfile: apps/web/Dockerfile.web
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - component: admin
            dockerfile: apps/admin/Dockerfile.admin
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - component: admin
            dockerfile: apps/admin/Dockerfile.admin
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.component }} ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/mrics-technologies/mrics-plane-${{ matrix.component }}:${{ needs.plan.outputs.channel }}-${{ matrix.arch }}-${{ needs.plan.outputs.short_sha }}
            ghcr.io/mrics-technologies/mrics-plane-${{ matrix.component }}:${{ needs.plan.outputs.channel }}-${{ matrix.arch }}-latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.architecture=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}-${{ needs.plan.outputs.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}-${{ needs.plan.outputs.channel }}
          provenance: false

  merge-web-admin:
    name: Merge ${{ matrix.component }} multi-arch manifest
    needs:
      - plan
      - build-web-admin
    strategy:
      fail-fast: false
      matrix:
        component:
          - frontend
          - admin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      frontend_image: ${{ steps.out.outputs.frontend_image }}
      admin_image: ${{ steps.out.outputs.admin_image }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/mrics-technologies/mrics-plane-${{ matrix.component }}"
          tag="${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.short_sha }}"
          for i in $(seq 1 30); do
            docker buildx imagetools inspect "$image:${{ needs.plan.outputs.channel }}-amd64-${{ needs.plan.outputs.short_sha }}" >/dev/null 2>&1 && \
            docker buildx imagetools inspect "$image:${{ needs.plan.outputs.channel }}-arm64-${{ needs.plan.outputs.short_sha }}" >/dev/null 2>&1 && break
            echo "waiting for arch image visibility ($i)"
            sleep 10
          done
          docker buildx imagetools create \
            -t "$image:${{ needs.plan.outputs.channel }}" \
            -t "$image:$tag" \
            "$image:${{ needs.plan.outputs.channel }}-amd64-${{ needs.plan.outputs.short_sha }}" \
            "$image:${{ needs.plan.outputs.channel }}-arm64-${{ needs.plan.outputs.short_sha }}"
          digest="$(docker buildx imagetools inspect "$image:$tag" | awk '/^Digest:/ {print $2; exit}')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Expose component image output
        id: out
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/mrics-technologies/mrics-plane-${{ matrix.component }}@${{ steps.manifest.outputs.digest }}"
          if [ "${{ matrix.component }}" = frontend ]; then
            echo "frontend_image=$ref" >> "$GITHUB_OUTPUT"
            echo "admin_image=" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_image=" >> "$GITHUB_OUTPUT"
            echo "admin_image=$ref" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy ${{ needs.plan.outputs.target }} (${{ matrix.name }}) through Coolify
    needs:
      - plan
      - build-backend
      - merge-web-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.instances) }}
    environment:
      name: ${{ needs.plan.outputs.target }}
      url: https://${{ matrix.public_host }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve frontend/admin manifest refs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          image_frontend="ghcr.io/mrics-technologies/mrics-plane-frontend:${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.short_sha }}"
          image_admin="ghcr.io/mrics-technologies/mrics-plane-admin:${{ needs.plan.outputs.channel }}-${{ needs.plan.outputs.short_sha }}"
          docker buildx imagetools inspect "$image_frontend" >/tmp/frontend.inspect
          docker buildx imagetools inspect "$image_admin" >/tmp/admin.inspect
          frontend_digest="$(awk '/^Digest:/ {print $2; exit}' /tmp/frontend.inspect)"
          admin_digest="$(awk '/^Digest:/ {print $2; exit}' /tmp/admin.inspect)"
          test -n "$frontend_digest"
          test -n "$admin_digest"
          echo "frontend_image=ghcr.io/mrics-technologies/mrics-plane-frontend@$frontend_digest" >> "$GITHUB_OUTPUT"
          echo "admin_image=ghcr.io/mrics-technologies/mrics-plane-admin@$admin_digest" >> "$GITHUB_OUTPUT"
      - name: Deploy via Coolify
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_ACCESS_TOKEN: ${{ secrets.COOLIFY_ACCESS_TOKEN }}
          PLANE_TARGET_ENV: ${{ needs.plan.outputs.target }}
          PLANE_SERVICE_UUID: ${{ matrix.service_uuid }}
          PLANE_SERVER_UUID: ${{ env.PLANE_SERVER_UUID }}
          PLANE_SERVER_IP: ${{ env.PLANE_SERVER_IP }}
          PLANE_PUBLIC_HOST: ${{ matrix.public_host }}
          PLANE_PRODUCTION_SERVICE_UUID: ${{ env.PLANE_PRODUCTION_SERVICE_UUID }}
          PLANE_PRODUCTION_SERVICE_UUIDS: ${{ env.PLANE_PRODUCTION_SERVICE_UUID }},${{ env.PLANE_MRICS_SERVICE_UUID }}
          PLANE_BACKEND_IMAGE: ${{ needs.build-backend.outputs.image }}
          PLANE_FRONTEND_IMAGE: ${{ steps.refs.outputs.frontend_image }}
          PLANE_ADMIN_IMAGE: ${{ steps.refs.outputs.admin_image }}
          PLANE_LIVE_IMAGE: ${{ env.PLANE_LIVE_IMAGE }}
          PLANE_SPACE_IMAGE: ${{ env.PLANE_SPACE_IMAGE }}
          PLANE_MINIO_IMAGE: ${{ env.PLANE_MINIO_IMAGE }}
          PLANE_NUM_PROXIES: ${{ env.PLANE_NUM_PROXIES }}
        run: python3 .github/scripts/coolify_plane_deploy.py
